<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>전기 에너지의 생산 — 음성 슬라이드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="stage" id="stage">
    <img class="slide" id="slide-img" alt="슬라이드" draggable="false">
    <div class="overlays" id="overlays"></div>
  </div>

  <div class="hud" id="status">
    <div class="row">
      <span class="mic-dot wait" id="mic-dot"></span>
      <span class="label" id="mic-label">대기</span>
    </div>
    <div class="heard" id="heard">들은 말: —</div>
    <div class="cmd" id="last-cmd">마지막 명령: —</div>
  </div>

  <div class="hud" id="counter">
    <span id="counter-text">1 / 21</span>
    <span class="reveal-step" id="reveal-text"></span>
  </div>

  <button class="hud" id="fs-btn" title="전체 화면 (F)" aria-label="전체 화면">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/>
    </svg>
  </button>

  <div class="toast" id="toast"></div>

  <div id="gate">
    <div class="gate-card">
      <h1>전기 에너지의 생산</h1>
      <p class="sub">교실 노트북의 크롬에서 열고, 스피커로 나오는<br>선생님 목소리를 페이지가 듣습니다.</p>
      <button type="button" id="start-btn">수업 시작</button>
      <p class="err" id="gate-err"></p>
      <div class="help">
        음성: 「다음 슬라이드」「넘겨」「이전 슬라이드」「뒤로」<br>
        「14번으로」「십사번으로」「14쪽」「정답 공개」「처음으로」<br>
        키보드: ← →, Space, 숫자+Enter, R 정답, F 전체화면, H 상태 숨김<br>
        크롬에서만 음성 인식이 됩니다. 마이크 권한을 허용해 주세요.
      </div>
    </div>
  </div>

  <script src="./commands.js"></script>
  <script src="./app.js"></script>
</body>
</html>
